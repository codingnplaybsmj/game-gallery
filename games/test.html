
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클릭 게임</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      padding: 50px;
    }
    button {
      font-size: 25px;
      padding: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🎮 클릭 게임</h1>
  <h2>점수: <span id="score">0</span></h2>
  <button onclick="addScore()">클릭!</button>

  <script>
    let score = 0;
    function addScore() {
      score++;
      document.getElementById("score").textContent = score;
    }
  </script>
</body>
</html>
